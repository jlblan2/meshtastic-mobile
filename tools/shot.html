<!DOCTYPE html>
<!-- Screenshot helper for tools/make_guide.py: shows one screen of the app (demo radio)
     so headless Edge can photograph it. Open as tools/shot.html?tab=nodes -->
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0a1929}iframe{border:0;width:390px;height:800px;display:block}</style>
</head><body>
<script>
localStorage.setItem('disclaimer.Meshtastic Mobile.v1', 'accepted');
const tab = new URLSearchParams(location.search).get('tab') || 'radio';
const f = document.createElement('iframe');
f.src = '../index.html' + (tab === 'connect' ? '' : '?demo');
document.body.appendChild(f);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  if (tab === 'connect') return;
  for (let i = 0; i < 40 && w.Radio.state !== 'connected'; i++) await wait(250);
  if (tab === 'messages') {
    w.MeshApp.showTab('messages');
    await wait(9500);
    d.getElementById('msgInput').value = 'Base copies, thanks. Radio check at the top of the hour.';
    d.getElementById('msgForm').requestSubmit();
    await wait(2000);
    d.getElementById('toast').hidden = true;
  } else if (tab.startsWith('settings-')) {
    w.MeshApp.showTab('settings');
    const want = tab.slice(9);
    d.querySelectorAll('#tab-settings details.sec').forEach((s) => {
      if (s.firstChild.textContent.toLowerCase().startsWith(want)) { s.open = true; s.scrollIntoView(); }
    });
  } else if (tab === 'node') {
    w.MeshApp.showTab('nodes');
    await wait(300);
    d.querySelectorAll('.node')[1].click();
  } else {
    w.MeshApp.showTab(tab);
  }
};
</script>
</body></html>
